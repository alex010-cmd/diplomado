# VPS BACKEND: API + Postgres en la misma VPC privada.
# Uso: cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Primera creacion del volumen: el entrypoint aplica init.sql
      # :z = reetiqueta SELinux (Fedora/RHEL); sin esto da Permission denied
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/init.sql:/init/init.sql:ro,z
    # Idempotente: reaplica tablas + SPs + seed en cada despliegue.
    # PGPASSWORD evita romper con claves con #,@,/,espacios (no va en la URL).
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "posdb",
              "-v", "ON_ERROR_STOP=1", "-f", "/init/init.sql"]

  api:
    build: .
    restart: unless-stopped
    # Si no existe .env no truena Compose: la API avisa que falta JWT_SECRET
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      # Imagenes fuera de la DB: persisten en disco del servidor
      - imgdata:/code/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  imgdata:
