<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Portal Académico</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">Portal Académico</div>
    <nav id="nav" class="topbar-nav" aria-label="Navegación principal"></nav>
    <div class="topbar-user">
      <span id="user-name"></span>
      <span id="user-role" class="badge"></span>
      <button type="button" id="logout-btn" class="btn btn-ghost">Salir</button>
    </div>
  </header>

  <main id="content" class="content"></main>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/profesor.js"></script>
  <script src="/js/estudiante.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
