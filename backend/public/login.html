<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Portal Académico</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Portal Académico</h1>
    <p class="muted">Gestión segura de notas</p>

    <form id="login-form" novalidate>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <p id="form-error" class="error" role="alert" hidden></p>

      <button type="submit" id="submit-btn">Iniciar sesión</button>
    </form>

    <p class="muted small">¿No tienes cuenta? <a href="/register.html">Regístrate</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
