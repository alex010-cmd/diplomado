<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Portal Académico</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Crear cuenta</h1>
    <p class="muted">Registro de estudiante</p>

    <form id="register-form" novalidate>
      <label for="name">Nombre completo</label>
      <input type="text" id="name" name="name" autocomplete="name" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
      <p class="hint">Mínimo 8 caracteres, con mayúsculas, minúsculas y números.</p>

      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>

      <p id="form-error" class="error" role="alert" hidden></p>

      <button type="submit" id="submit-btn">Registrarse</button>
    </form>

    <p class="muted small">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
