# Filtro Fail2Ban: logins fallidos o bloqueados por rate-limit en el API.
# nginx combined:  1.2.3.4 - - [fecha] "POST /api/auth/login HTTP/1.1" 401 ...
# Tambien cuenta 429 (la app bloquea tras 5 intentos) para mantener el ban.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /api/auth/login[^"]*" (401|429)\b
ignoreregex =
