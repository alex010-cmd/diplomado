# Accion Fail2Ban para trafico que entra por Docker (puertos publicados).
# Los DROP deben ir en la cadena DOCKER-USER; la cadena INPUT no ve el
# trafico reenviado a los contenedores.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = iptables -I DOCKER-USER -s <ip> -j DROP
actionunban = iptables -D DOCKER-USER -s <ip> -j DROP

[Init]
